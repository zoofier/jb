<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ZOOF13R // SHADOW EXPLOIT HOST</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;900&family=Consolas:wght@400;700&display=swap');
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-dark: #121212;
        --bg-base: #1A1A1A;
        --sidebar-bg: #0F0F0F;
        --card-bg: #1F1F1F;
        --border-color: #333333;
        --text-main: #E0E0E0;
        --text-dim: #A0A0A0;
        --green: #00FF00;
        --red: #FF3333;
        --rgb-color: #FF6600;
        --rgb-shadow: rgba(255, 102, 0, 0.6);
      }

      /* ── Global Master RGB Styles ── */
      .rgb-text {
        color: var(--rgb-color) !important;
        text-shadow: 0 0 12px var(--rgb-shadow) !important;
      }

      .rgb-border {
        border-color: var(--rgb-color) !important;
        box-shadow: 0 0 12px var(--rgb-shadow) !important;
      }

      .star {
        font-size: 10px;
        vertical-align: middle;
        display: inline-block;
        margin: 0 6px;
        transform: translateY(-2px);
        color: var(--rgb-color) !important;
        text-shadow: 0 0 8px var(--rgb-shadow) !important;
      }

      html, body {
        min-height: 100vh;
        background: var(--bg-dark);
        color: var(--text-main);
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 14px;
        overflow-x: hidden;
      }

      #brand {
        text-align: center;
        padding: 16px 20px;
        background: #111111;
        border-bottom: 2px solid var(--rgb-color) !important;
        box-shadow: 0 0 15px var(--rgb-shadow);
        font-family: 'Arial Black', Impact, sans-serif;
        font-size: 24px;
        font-weight: 900;
        font-style: italic;
        letter-spacing: 2px;
        color: var(--rgb-color) !important;
        text-shadow: 0 0 15px var(--rgb-shadow) !important;
        user-select: none;
      }

      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 50px;
        height: 50px;
        margin: -25px 0 0 -25px;
        border: 4px solid #1e2732;
        border-top-color: var(--rgb-color) !important;
        box-shadow: 0 0 15px var(--rgb-shadow);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--rgb-color) !important;
        text-shadow: 0 0 10px var(--rgb-shadow) !important;
        display: none;
      }
      #wrap { padding: 0; }
      #state, #out { display: none; }

      body.done #spin { display: none; }
      body.fail #spin { display: none; }
      body.fail #msg { display: block; }

      /* ?log=1 -- the full step log */
      body.log #spin, body.log #msg { display: none; }
      body.log #wrap { padding: 18px 24px; }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 800;
        margin: 0 0 12px;
        color: var(--rgb-color) !important;
        text-shadow: 0 0 10px var(--rgb-shadow) !important;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font-family: Consolas, monospace;
        font-size: 13px;
        background: #0F0F0F;
        border: 1px solid var(--rgb-color) !important;
        box-shadow: 0 0 15px var(--rgb-shadow) !important;
        border-radius: 8px;
        padding: 16px;
        height: calc(100vh - 141px);
        overflow-y: auto;
        color: var(--text-main);
      }
      .ok { color: #00FF00 !important; text-shadow: 0 0 8px rgba(0,255,0,0.4); }
      .bad { color: #FF3333 !important; text-shadow: 0 0 8px rgba(255,51,51,0.4); }
      .warn { color: var(--rgb-color) !important; text-shadow: 0 0 8px var(--rgb-shadow) !important; }
      .safe { color: #00FF00 !important; }
      .danger { color: #FF3333 !important; }
      code { color: var(--rgb-color) !important; }

      #foot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 8px;
        text-align: center;
        font-size: 12px;
        color: var(--text-dim);
        letter-spacing: 0.06em;
        pointer-events: none;
        line-height: 1.5;
        user-select: none;
      }
      #foot b { color: var(--text-main); font-weight: 700; }
      #foot a {
        color: var(--rgb-color) !important;
        text-shadow: 0 0 6px var(--rgb-shadow) !important;
        text-decoration: none;
        pointer-events: auto;
      }
      #foot .hint { color: var(--text-dim); font-style: italic; margin-left: 4px; }
    </style>
  </head>
  <body>
    <div id="brand">
      <span class="star">★</span> ZOOF13R // SHADOW HOST <span class="star">★</span>
    </div>

    <div id="spin"></div>
    <div id="msg">INITIATING EXPLOIT CHAIN...</div>

    <div id="wrap">
      <div id="state">STAT: INITIALIZING</div>
      <div id="out"></div>
    </div>

    <div id="foot">
      <b>ZOOF13R 13.52 HOST</b> | SYSTEM READY <span class="hint">(STABLE WEBKIT HOOK)</span>
    </div>

    <script>
    (function startRGBEngine() {
      var hue = 0;
      setInterval(function() {
        hue = (hue + 2) % 360;
        var h = hue / 60;
        var x = 1 - Math.abs((h % 2) - 1);
        var r = 0, g = 0, b = 0;
        if (h < 1) { r = 1; g = x; b = 0; }
        else if (h < 2) { r = x; g = 1; b = 0; }
        else if (h < 3) { r = 0; g = 1; b = x; }
        else if (h < 4) { r = 0; g = x; b = 1; }
        else if (h < 5) { r = x; g = 0; b = 1; }
        else { r = 1; g = 0; b = x; }
        
        var hexR = Math.round(r * 255).toString(16).padStart(2, '0');
        var hexG = Math.round(g * 255).toString(16).padStart(2, '0');
        var hexB = Math.round(b * 255).toString(16).padStart(2, '0');
        var color = '#' + hexR + hexG + hexB;
        var shadow = 'rgba(' + Math.round(r*255) + ',' + Math.round(g*255) + ',' + Math.round(b*255) + ', 0.6)';

        document.documentElement.style.setProperty('--rgb-color', color);
        document.documentElement.style.setProperty('--rgb-shadow', shadow);
      }, 50);
    })();
    </script>
  </body>
</html>
