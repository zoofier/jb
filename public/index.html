<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webkit-host</title>
    <style>
        /* ── Reset ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 2.5rem 3rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00ff87;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.2; }
        }

        h1 {
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
            letter-spacing: 0.08em;
        }

        .subtitle {
            font-size: 0.78rem;
            color: #555;
            margin-bottom: 2rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .log {
            background: #0a0a0a;
            border: 1px solid #1e1e1e;
            border-radius: 4px;
            padding: 1rem;
            font-size: 0.75rem;
            color: #00ff87;
            text-align: left;
            line-height: 1.7;
            min-height: 100px;
        }

        .log span { color: #555; }

        footer {
            margin-top: 2rem;
            font-size: 0.65rem;
            color: #333;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1><span class="status-dot"></span>webkit-host</h1>
        <p class="subtitle">zoofier / local payload server</p>

        <div class="log" id="log">
            <span>$</span> server online...<br/>
            <span>$</span> waiting for payload...<br/>
        </div>
    </div>

    <footer>drop your payload scripts into ./public/ and link them here</footer>

    <!--
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        DROP YOUR PAYLOAD SCRIPT TAG BELOW:
        <script src="./your-payload.js"></script>
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    -->

    <script>
        // Append a boot timestamp to the log on load
        const log  = document.getElementById("log");
        const ts   = new Date().toISOString();
        log.innerHTML += `<span>$</span> page loaded @ ${ts}<br/>`;
    </script>
</body>
</html>
