<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zoof13r // PS4 13.52</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080a0e; --surface: #0d1117; --border: #1e2732;
      --text: #c8ced8; --text-dim: #5a6478; --text-hi: #e8edf5;
      --orange: #ff6600; --orange-glow: rgba(255,102,0,0.15);
      --green: #22c55e;
    }
    html, body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 44px 48px; width: 480px; max-width: calc(100vw - 32px);
      box-shadow: 0 0 40px var(--orange-glow); text-align: center;
    }
    .logo { font-size: 36px; margin-bottom: 12px; }
    h1 { font-size: 22px; font-weight: 900; letter-spacing: 0.08em; color: var(--text-hi); }
    .sub { font-size: 11px; color: var(--orange); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.15em; margin-top: 4px; margin-bottom: 24px; }
    .btn {
      display: block; width: 100%; padding: 16px; border-radius: 10px;
      background: var(--orange); color: #fff; font-size: 15px; font-weight: 700;
      letter-spacing: 0.08em; text-decoration: none; transition: transform 0.15s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(255,102,0,0.3); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡</div>
    <h1>ZOOF13R</h1>
    <div class="sub">PS4 FIRMWARE 13.52 HOST</div>
    <a href="jb.html" class="btn">⚡ LAUNCH HOST</a>
  </div>
</body>
</html>
