<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zoof13r // PS4 13.52</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080a0e;
      --surface:   #0d1117;
      --border:    #1e2732;
      --border-hi: #2d3f52;
      --text:      #c8ced8;
      --text-dim:  #5a6478;
      --text-hi:   #e8edf5;
      --green:     #7fd0a0;
      --green-dim: #2a5c3f;
      --red:       #d08a7f;
      --yellow:    #d8c07f;
      --blue:      #7fa8d0;
      --purple:    #a07fd0;
      --glow:      rgba(127, 208, 160, 0.15);
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* ── background grid ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    /* ── radial glow behind card ── */
    body::after {
      content: '';
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse, var(--glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 44px 48px;
      width: 520px;
      max-width: calc(100vw - 32px);
      box-shadow:
        0 0 0 1px var(--border),
        0 24px 80px rgba(0,0,0,0.6),
        0 0 40px var(--glow);
    }

    /* ── header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .logo {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--green), var(--blue));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 0 20px var(--glow);
    }

    .title-block h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-hi);
      text-transform: uppercase;
    }
    .title-block .sub {
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      margin-top: 2px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── badge row ── */
    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid;
      letter-spacing: 0.05em;
    }
    .badge.fw   { color: var(--green);  border-color: var(--green-dim); background: rgba(127,208,160,0.08); }
    .badge.type { color: var(--blue);   border-color: #2a3f52;          background: rgba(127,168,208,0.08); }
    .badge.mode { color: var(--purple); border-color: #3a2a52;          background: rgba(160,127,208,0.08); }

    /* ── status indicator ── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 24px;
    }
    .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 8px var(--yellow);
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }
    .dot.ready { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .dot.error { background: var(--red);   box-shadow: 0 0 8px var(--red); animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    .status-text {
      font-size: 13px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
    }
    .status-text span { color: var(--text-dim); }

    /* ── divider ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 24px 0;
    }

    /* ── action buttons ── */
    .actions { display: flex; flex-direction: column; gap: 10px; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 10px;
      border: 1px solid;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.18s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(127,208,160,0.18), rgba(127,168,208,0.12));
      border-color: var(--green);
      color: var(--green);
      box-shadow: 0 0 20px rgba(127,208,160,0.12);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, rgba(127,208,160,0.28), rgba(127,168,208,0.2));
      box-shadow: 0 0 30px rgba(127,208,160,0.25);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
      background: transparent;
      border-color: var(--border-hi);
      color: var(--text-dim);
    }
    .btn-secondary:hover {
      border-color: var(--blue);
      color: var(--blue);
      background: rgba(127,168,208,0.06);
    }

    .btn-ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text-dim);
      font-size: 12px;
      padding: 10px 20px;
    }
    .btn-ghost:hover {
      border-color: var(--border-hi);
      color: var(--text);
    }

    /* ── info grid ── */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }
    .info-cell {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .info-cell .label {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .info-cell .value {
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-hi);
    }
    .info-cell .value.green { color: var(--green); }

    /* ── footer ── */
    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">⚡</div>
      <div class="title-block">
        <h1>zoof13r</h1>
        <div class="sub">PS4 13.52 // LOCAL PAYLOAD HOST</div>
      </div>
    </div>

    <div class="badges">
      <div class="badge fw">FW 13.52</div>
      <div class="badge type">WebKit JB</div>
      <div class="badge mode">LOCAL HOST</div>
    </div>

    <div class="status-row" id="statusRow">
      <div class="dot" id="dot"></div>
      <div class="status-text" id="statusText">
        Server running — <span>waiting for PS4 connection</span>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-cell">
        <div class="label">Host URL</div>
        <div class="value green" id="hostUrl">detecting...</div>
      </div>
      <div class="info-cell">
        <div class="label">Port</div>
        <div class="value">8080</div>
      </div>
      <div class="info-cell">
        <div class="label">Exploit</div>
        <div class="value">raw13g chain</div>
      </div>
      <div class="info-cell">
        <div class="label">Retry</div>
        <div class="value green">auto (×8)</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="actions">
      <a href="/jb.html" class="btn btn-primary">
        ⚡ Launch Jailbreak
      </a>
      <a href="/jb.html?log=1" class="btn btn-secondary">
        📋 Launch with Log View
      </a>
      <a href="/jb.html?verbose=1&log=1" class="btn btn-ghost">
        verbose + log
      </a>
    </div>
  </div>

  <div class="footer">
    zoof13r // point PS4 browser at this IP:8080/jb.html
  </div>

  <script>
    // show the actual server URL in the card
    const url = `${location.hostname}:${location.port}`;
    document.getElementById('hostUrl').textContent = url;

    // flip dot to green once the page loads (means server is up)
    document.getElementById('dot').className = 'dot ready';
    document.getElementById('statusText').innerHTML =
      'Server <span style="color:var(--green)">online</span> — point PS4 at <b>/jb.html</b>';
  </script>
</body>
</html>
