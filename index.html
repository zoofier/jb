<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07090d">
<title>ZOOF13R 14.00</title>
<style>
html,body{margin:0;padding:0;background:#07090d;color:#eee;font-family:Arial,sans-serif}
body{padding:18px}.box{max-width:760px;margin:auto;background:#10131a;border:1px solid #303642;border-radius:16px;padding:22px}
h1{font-size:24px;margin:0 0 5px}.muted{color:#8992a3;font-size:12px;margin-bottom:20px}
.info{border-top:1px solid #282d37;padding:10px 0}.label{color:#8d96a7;font-size:11px}.value{font-size:15px;font-weight:bold;margin-top:3px}
button{display:block;width:100%;padding:15px;margin-top:10px;border:0;border-radius:10px;font-weight:bold;font-size:16px;background:#eee;color:#08090d}
button.secondary{background:#242934;color:#eee;font-size:13px}
button:disabled{opacity:.45}
#log{background:#050609;border:1px solid #242934;border-radius:10px;min-height:130px;padding:12px;margin-top:16px;white-space:pre-wrap;font:12px monospace;overflow:auto}
#result{display:none;margin-top:16px;padding:18px;border:1px solid #3b4350;border-radius:10px}
.good{border-color:#4d9d69!important}.bad{border-color:#a34e57!important}
.stage{padding:8px 0;border-bottom:1px solid #222733}.state{float:right}
</style></head>
<body><div class="box">
<h1>ZOOF13R // PS4 14.00</h1><div class="muted">Legacy PS4-browser-compatible host / diagnostic layer</div>
<div class="info"><div class="label">Firmware</div><div class="value" id="fw">Checking...</div></div>
<div class="info"><div class="label">Browser</div><div class="value" id="browser">Checking...</div></div>
<div class="info"><div class="label">Target</div><div class="value" id="target">Checking...</div></div>
<div class="info"><div class="label">Cache/storage</div><div class="value" id="storage">Checking...</div></div>
<button id="start" onclick="startTest()">JAILBREAK</button>
<button class="secondary" onclick="demo()">TEST UI ONLY</button>
<div id="stages">
<div class="stage">Environment <span class="state" id="s1">—</span></div>
<div class="stage">Browser <span class="state" id="s2">—</span></div>
<div class="stage">Exploit module <span class="state" id="s3">—</span></div>
<div class="stage">Userland <span class="state" id="s4">—</span></div>
<div class="stage">Kernel <span class="state" id="s5">—</span></div>
<div class="stage">HEN / GoldHEN <span class="state" id="s6">—</span></div>
</div>
<pre id="log"></pre><div id="result"><b id="rt"></b><div id="rb"></div></div>
<script>
(function(){
window.zlog=function(x){var e=document.getElementById("log");e.innerHTML+=x+"\\n";e.scrollTop=e.scrollHeight};
window.wait=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
window.detect=function(){
 var ua=navigator.userAgent||"";
 var fw="UNKNOWN",m;
 m=ua.match(/PlayStation 4[ /]([0-9]+\\.[0-9]+)/i);
 if(m)fw=m[1];
 document.getElementById("fw").innerHTML=fw;
 document.getElementById("browser").innerHTML=/AppleWebKit/i.test(ua)?"WebKit detected":"WebKit not identified";
 document.getElementById("target").innerHTML=fw==="14.00"?"14.00 READY":"14.00 REQUIRED";
 var storage="Unavailable";
 try{localStorage.setItem("__z","1");storage=localStorage.getItem("__z")==="1"?"Available":"Unavailable";localStorage.removeItem("__z")}catch(e){}
 document.getElementById("storage").innerHTML=storage;
 zlog("User agent: "+ua);
 zlog("Detected firmware: "+fw);
 zlog("This is a legacy-compatible host.");
 zlog("No modern ES modules are required.");
 if(fw!=="14.00"){document.getElementById("start").disabled=true;zlog("Target gate: 14.00 only.");}
};
window.stage=function(n,t){document.getElementById("s"+n).innerHTML=t};
window.show=function(title,body,good){
 var r=document.getElementById("result");r.style.display="block";r.className=good?"good":"bad";
 document.getElementById("rt").innerHTML=title;document.getElementById("rb").innerHTML=body;
};
window.demo=async function(){
 document.getElementById("start").disabled=true;document.getElementById("log").innerHTML="";
 zlog("UI demonstration started. No exploit is executed.");
 for(var i=1;i<=6;i++){stage(i,"...");await wait(400);stage(i,i<3?"PASS":"DEMO")};
 show("DEMO COMPLETE","This verifies the PS4-compatible UI only. It did not jailbreak the console.",false);
 document.getElementById("start").disabled=false;
};
window.startTest=async function(){
 document.getElementById("start").disabled=true;
 document.getElementById("log").innerHTML="";
 stage(1,"...");zlog("Starting 14.00 verification...");await wait(300);stage(1,"PASS");
 stage(2,"...");await wait(300);stage(2,"PASS");
 stage(3,"BLOCKED");zlog("No verified public 14.00 browser exploit module is installed.");
 show("NOT JAILBROKEN","The host is working, but this package does not contain a verified 14.00 WebKit/kernel exploit. It will not falsely report GoldHEN.",false);
 document.getElementById("start").disabled=false;
};
detect();
})();
</script></div></body></html>
