<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZOOF13R // PS4 13.52 HOST</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;900&family=Consolas:wght@400;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-dark: #121212;
      --bg-base: #1A1A1A;
      --surface: #0F0F0F;
      --border: #333333;
      --text: #E0E0E0;
      --text-dim: #A0A0A0;
      --rgb-color: #FF6600;
      --rgb-shadow: rgba(255, 102, 0, 0.6);

    .star {
      font-size: 10px;
      vertical-align: middle;
      display: inline-block;
      margin: 0 6px;
      transform: translateY(-2px);
      color: var(--rgb-color) !important;
      text-shadow: 0 0 8px var(--rgb-shadow) !important;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg-dark);
      color: var(--text);
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--rgb-color) !important;
      border-radius: 12px;
      padding: 44px 48px;
      width: 480px;
      max-width: calc(100vw - 32px);
      box-shadow: 0 0 25px var(--rgb-shadow) !important;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 32px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 3px;
      color: var(--rgb-color) !important;
      text-shadow: 0 0 15px var(--rgb-shadow) !important;
    }

    .sub {
      font-size: 13px;
      font-weight: 700;
      color: var(--rgb-color) !important;
      text-shadow: 0 0 10px var(--rgb-shadow) !important;
      font-family: Consolas, monospace;
      letter-spacing: 0.15em;
      margin-top: 6px;
      margin-bottom: 28px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 6px;
      background: var(--rgb-color) !important;
      color: #000000 !important;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-decoration: none;
      box-shadow: 0 0 15px var(--rgb-shadow) !important;
      transition: transform 0.15s ease;
      cursor: pointer;
    }

    .btn:hover {
      transform: scale(1.02);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡</div>
    <h1><span class="star">★</span> ZOOF13R <span class="star">★</span></h1>
    <div class="sub">PS4 FIRMWARE 13.52 HOST</div>
    <a href="jb.html" class="btn">⚡ LAUNCH HOST</a>
  </div>

  <script>
  (function startRGBEngine() {
    var hue = 0;
    setInterval(function() {
      hue = (hue + 2) % 360;
      var h = hue / 60;
      var x = 1 - Math.abs((h % 2) - 1);
      var r = 0, g = 0, b = 0;
      if (h < 1) { r = 1; g = x; b = 0; }
      else if (h < 2) { r = x; g = 1; b = 0; }
      else if (h < 3) { r = 0; g = 1; b = x; }
      else if (h < 4) { r = 0; g = x; b = 1; }
      else if (h < 5) { r = x; g = 0; b = 1; }
      else { r = 1; g = 0; b = x; }
      
      var hexR = Math.round(r * 255).toString(16).padStart(2, '0');
      var hexG = Math.round(g * 255).toString(16).padStart(2, '0');
      var hexB = Math.round(b * 255).toString(16).padStart(2, '0');
      var color = '#' + hexR + hexG + hexB;
      var shadow = 'rgba(' + Math.round(r*255) + ',' + Math.round(g*255) + ',' + Math.round(b*255) + ', 0.6)';

      document.documentElement.style.setProperty('--rgb-color', color);
      document.documentElement.style.setProperty('--rgb-shadow', shadow);
    }, 50);
  })();
  </script>
</body>
</html>
