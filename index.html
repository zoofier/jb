<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zoof13r — WebKit Host</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green:  #00ff87;
            --dim:    #1a1a1a;
            --border: #222;
            --muted:  #444;
        }

        body {
            background: #080808;
            color: #c8c8c8;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }

        /* scanline overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.08) 2px,
                rgba(0,0,0,0.08) 4px
            );
            pointer-events: none;
            z-index: 999;
        }

        /* ── HEADER ── */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            color: #fff;
            text-shadow: 0 0 30px rgba(0,255,135,0.25);
            line-height: 1;
        }

        .logo .accent { color: var(--green); }

        .tagline {
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        /* ── CARD ── */
        .card {
            background: #0e0e0e;
            border: 1px solid var(--border);
            border-top: 1px solid #2a2a2a;
            border-radius: 6px;
            width: 100%;
            max-width: 560px;
            overflow: hidden;
        }

        .card-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0.65rem 1rem;
            background: #111;
            border-bottom: 1px solid var(--border);
        }

        .dot { width:9px; height:9px; border-radius:50%; }
        .dot.r { background:#ff5f57; }
        .dot.y { background:#febc2e; }
        .dot.g { background:#28c840; }

        .card-title {
            font-size: 0.68rem;
            color: var(--muted);
            letter-spacing: 0.15em;
            margin-left: 6px;
        }

        /* ── TERMINAL ── */
        .terminal {
            padding: 1.2rem 1.4rem;
            font-size: 0.73rem;
            line-height: 2;
            min-height: 160px;
        }

        .line { display: flex; gap: 0.6rem; }
        .line .prompt { color: var(--green); user-select: none; }
        .line .cmd    { color: #e0e0e0; }
        .line .ok     { color: var(--green); }
        .line .dim    { color: var(--muted); }
        .line.typing .cursor {
            display: inline-block;
            width: 7px; height: 13px;
            background: var(--green);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* ── STATUS ── */
        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1.4rem;
            border-top: 1px solid var(--border);
            font-size: 0.65rem;
            color: var(--muted);
            letter-spacing: 0.1em;
        }

        .pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            color: var(--green);
        }

        .pulse-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--green); }
            50%       { opacity: 0.2; box-shadow: none; }
        }

        /* ── FOOTER ── */
        footer {
            margin-top: 1.8rem;
            font-size: 0.6rem;
            color: #282828;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">ZO<span class="accent">O</span>F<span class="accent">1</span>3R</div>
        <div class="tagline">webkit host &nbsp;·&nbsp; fw 13.52 &nbsp;·&nbsp; lan payload server</div>
    </div>

    <div class="card">
        <div class="card-bar">
            <div class="dot r"></div>
            <div class="dot y"></div>
            <div class="dot g"></div>
            <span class="card-title">zoof13r / webkit-host — bash</span>
        </div>

        <div class="terminal" id="terminal">
            <!-- lines injected by JS -->
        </div>

        <div class="status-row">
            <span id="ts">--:--:--</span>
            <div class="pill"><div class="pulse-dot"></div> SERVER ONLINE</div>
        </div>
    </div>

    <footer>drop payload scripts into ./public/ &nbsp;·&nbsp; zoof13r</footer>

    <!--
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        DROP YOUR PAYLOAD SCRIPT TAG BELOW:
        <script src="./your-payload.js"></script>
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    -->

    <script>
        // ── live clock ──
        const tsEl = document.getElementById("ts");
        const tick = () => { tsEl.textContent = new Date().toLocaleTimeString(); };
        tick(); setInterval(tick, 1000);

        // ── animated terminal boot sequence ──
        const term  = document.getElementById("terminal");
        const now   = new Date().toISOString();
        const lines = [
            { prompt: "[zoof13r]$", cmd: "webkit-host --fw 13.52 --port 8080", delay: 0 },
            { prompt: "",           cmd: '<span class="ok">✓</span> server bound to 0.0.0.0:8080', delay: 400 },
            { prompt: "",           cmd: '<span class="ok">✓</span> ./public/ mounted', delay: 700 },
            { prompt: "",           cmd: `<span class="dim">» page hit @ ${now}</span>`, delay: 1000 },
            { prompt: "",           cmd: '<span class="ok">✓</span> PS4 connection ready — awaiting browser', delay: 1350 },
            { prompt: "[zoof13r]$", cmd: '<span class="cursor"></span>', cls: "typing", delay: 1800 },
        ];

        lines.forEach(({ prompt, cmd, cls, delay }) => {
            setTimeout(() => {
                const div = document.createElement("div");
                div.className = "line" + (cls ? ` ${cls}` : "");
                div.innerHTML = prompt
                    ? `<span class="prompt">${prompt}</span><span class="cmd">${cmd}</span>`
                    : `<span class="cmd" style="padding-left:6.2rem;">${cmd}</span>`;
                term.appendChild(div);
            }, delay);
        });
    </script>
</body>
</html>
