<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZOOF13R // BO2 RTM TOOL & HOST</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;900&family=Consolas:wght@400;700&display=swap");
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg-dark: #121212;
        --bg-base: #1A1A1A;
        --card-bg: #1F1F1F;
        --border-color: #333333;
        --orange: #FF6600;
        --cyan-blue: #00D2FF;
        --text-main: #E0E0E0;
        --text-dim: #A0A0A0;
        --green: #00FF00;
        --red: #FF3333;
      }
      html, body {
        min-height: 100vh;
        background: var(--bg-dark);
        color: var(--text-main);
        font-family: 'Segoe UI', Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
      }
      #app-base {
        width: 100%;
        min-height: 100vh;
        border: 1px solid var(--orange);
        background-color: var(--bg-base);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      /* Top Bar */
      #top-bar {
        background-color: #111111;
        border-bottom: 2px solid var(--orange);
        height: 85px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 25px;
      }
      .brand-left {
        font-family: 'Arial Black', Impact, sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 36px;
        letter-spacing: 2px;
        color: var(--orange);
      }
      .brand-center {
        font-family: 'Arial Black', Impact, sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 42px;
        letter-spacing: 4px;
        color: #FFFFFF;
        text-shadow: 0 0 25px var(--cyan-blue), 0 0 40px var(--orange);
      }
      .status-badge {
        font-weight: 800;
        color: var(--orange);
        font-size: 14px;
      }

      #main-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
      }

      /* Spinner */
      #spin {
        width: 60px;
        height: 60px;
        border: 4px solid var(--border-color);
        border-top-color: var(--orange);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        margin-bottom: 25px;
        box-shadow: 0 0 20px rgba(255, 102, 0, 0.3);
      }
      body.done #spin {
        border-color: var(--green);
        border-top-color: var(--green);
        animation: none;
        box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
      }
      body.fail #spin {
        border-color: var(--red);
        border-top-color: var(--red);
        animation: none;
        box-shadow: 0 0 25px rgba(255, 51, 51, 0.4);
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      #msg {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1px;
        color: var(--orange);
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      body.done #msg { color: var(--green); }
      body.fail #msg { color: var(--red); }

      /* Bottom Green Log Console */
      #log-frame {
        width: 100%;
        padding: 15px 25px 25px 25px;
      }
      #log-box {
        background-color: #0A0A0A;
        color: var(--green);
        font-family: Consolas, 'Courier New', monospace;
        font-size: 13px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 12px;
        height: 100px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
        text-align: left;
      }

      #wrap { display: none; }
      body.log #wrap { display: block; }
    </style>
  </head>
  <body>
    <div id="app-base">
      <div id="top-bar">
        <div class="brand-left">ZOOF13R</div>
        <div class="brand-center">RTM TOOL</div>
        <div class="status-badge" id="status-badge">★ EXPLOIT ENGINE ★</div>
      </div>

      <div id="main-wrap">
        <div id="spin"></div>
        <div id="msg">★ RUNNING EXPLOIT ENGINE — DO NOT NAVIGATE AWAY ★</div>
        <div id="wrap">
          <div id="state"></div>
          <div id="out"></div>
        </div>
      </div>

      <div id="log-frame">
        <div id="log-box">[EXPLOIT ENGINE] EXECUTING WEBKIT PRIMITIVE AND KERNEL PATCH CHAIN...</div>
      </div>
    </div>

    <script>
      var msgEl = document.getElementById('msg');
      var logBox = document.getElementById('log-box');
      new MutationObserver(function() {
        var c = document.body.className;
        var ts = new Date().toTimeString().split(' ')[0];
        if (c.indexOf('done') !== -1) {
          msgEl.textContent = '★ JAILBROKEN — NOW SELECT PAYLOAD ★';
          logBox.innerHTML += '\n[' + ts + '] ✓ EXPLOIT & KERNEL PATCH SUCCESSFUL!';
        } else if (c.indexOf('fail') !== -1) {
          msgEl.textContent = '★ FAILED — COLD REBOOT PS4 AND RETRY ★';
          logBox.innerHTML += '\n[' + ts + '] ✗ EXPLOIT FAILED — COLD REBOOT REQUIRED.';
        }
      }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
    </script>

    <script type="module">
      import "./jb.js?v=11";
    </script>
  </body>
</html>
