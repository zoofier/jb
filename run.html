<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZOOF13R // EXPLOIT ENGINE</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap");
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #080a0d;
        --panel: #0d1117;
        --border: #1a2030;
        --orange: #ff6600;
        --orange-glow: rgba(255, 102, 0, 0.15);
        --green: #22c55e;
        --red: #ef4444;
        --text: #9aa3b0;
        --text-dim: #4a5468;
        --text-hi: #dde4f0;
        --mono: "JetBrains Mono", Consolas, monospace;
        --sans: "Inter", system-ui, sans-serif;
      }
      html, body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 0;
      }
      /* Header */
      #hdr {
        width: 100%;
        height: 54px;
        background: rgba(8, 10, 13, 0.96);
        border-bottom: 2px solid var(--orange);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        box-shadow: 0 0 20px var(--orange-glow);
      }
      .brand-box {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 900;
        font-size: 16px;
        letter-spacing: 0.12em;
        color: var(--text-hi);
      }
      .brand-z {
        color: var(--orange);
        font-style: italic;
      }
      .brand-badge {
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        padding: 2px 7px;
        border: 1px solid var(--orange);
        border-radius: 3px;
        color: var(--orange);
        letter-spacing: 0.1em;
        margin-left: 6px;
      }

      /* Main Wrap */
      #wrap-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
        width: 100%;
        max-width: 600px;
        text-align: center;
      }

      /* Spinner */
      #spin {
        width: 54px;
        height: 54px;
        border: 4px solid var(--border);
        border-top-color: var(--orange);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        margin-bottom: 24px;
        box-shadow: 0 0 15px var(--orange-glow);
      }
      body.done #spin {
        border-color: var(--green);
        border-top-color: var(--green);
        animation: none;
        box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
      }
      body.fail #spin {
        border-color: var(--red);
        border-top-color: var(--red);
        animation: none;
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Message */
      #msg {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.08em;
        color: var(--orange);
        text-transform: uppercase;
        margin-bottom: 20px;
        font-family: var(--sans);
      }
      body.done #msg { color: var(--green); }
      body.fail #msg { color: var(--red); }

      /* Log Container */
      #wrap {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        text-align: left;
        display: none; /* Only shown if log mode enabled */
      }
      body.log #wrap { display: block; }
      #state {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        color: var(--orange);
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      #out {
        font-family: var(--mono);
        font-size: 10px;
        line-height: 1.6;
        max-height: 250px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
        color: var(--text);
      }

      /* Footer */
      #foot {
        width: 100%;
        padding: 16px;
        border-top: 1px solid var(--border);
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text-dim);
        text-align: center;
        letter-spacing: 0.1em;
      }
      #foot b { color: var(--orange); }
    </style>
  </head>
  <body>
    <div id="hdr">
      <div class="brand-box">
        <span>⚡</span>
        <span class="brand-z">ZOOF13R</span>
        <span>WEBKIT</span>
        <span class="brand-badge">FW 13.52</span>
      </div>
    </div>

    <div id="wrap-main">
      <div id="spin"></div>
      <div id="msg">RUNNING EXPLOIT — DO NOT NAVIGATE AWAY</div>
      <div id="wrap">
        <div id="state"></div>
        <div id="out"></div>
      </div>
    </div>

    <script>
      // Sync UI status message with body class state
      var msgEl = document.getElementById('msg');
      new MutationObserver(function() {
        var c = document.body.className;
        if (c.indexOf('done') !== -1) {
          msgEl.textContent = '✓ JAILBROKEN — NOW LOAD A PAYLOAD';
        } else if (c.indexOf('fail') !== -1) {
          msgEl.textContent = '✗ FAILED — COLD REBOOT AND RETRY';
        }
      }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
    </script>

    <!-- Static ES module import for jb.js execution -->
    <script type="module">
      import "./jb.js?v=11";
    </script>

    <div id="foot">
      ZOOF13R PS4 13.52 HOST &middot; <b>OFFICIAL RELEASE</b>
    </div>
  </body>
</html>
