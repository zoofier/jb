<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZOOF13R // 13.52</title>
<style>
/* NO external requests — zero HTTP overhead during exploit */
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#080a0d;color:#9aa3b0;font:400 13px/1.5 monospace;min-height:100vh}
#hdr{background:#0d1117;border-bottom:2px solid #ff6600;padding:0 16px;height:46px;display:flex;align-items:center;gap:8px}
#hdr b{color:#ff6600;font-style:italic;font-size:15px;letter-spacing:.1em}
#hdr span{color:#dde4f0;letter-spacing:.25em;font-size:12px}
#fw{border:1px solid #ff6600;border-radius:3px;color:#ff6600;font-size:9px;padding:2px 7px;letter-spacing:.12em;margin-left:6px}
#dot{width:7px;height:7px;border-radius:50%;background:#3a4255;margin-left:auto;transition:background .3s}
#dot.run{background:#ff6600}
#dot.ok{background:#22c55e}
#dot.bad{background:#ef4444}
#lbl{font-size:9px;letter-spacing:.15em;color:#3a4255;margin-left:5px}

#wrap{max-width:520px;margin:0 auto;padding:28px 14px}

/* spinner — CSS only, no JS needed */
#spin{width:48px;height:48px;border:3px solid #1a2030;border-top-color:#ff6600;border-radius:50%;margin:36px auto 20px;animation:sp .75s linear infinite}
body.done #spin{border-color:#22c55e;border-top-color:#22c55e;animation:none}
body.fail #spin{border-color:#ef4444;border-top-color:#ef4444;animation:none}
@keyframes sp{to{transform:rotate(360deg)}}

#msg{text-align:center;font:700 16px/1.3 monospace;color:#ff6600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:24px;word-break:break-word}
body.done #msg{color:#22c55e}
body.fail #msg{color:#ef4444}

#result{display:none;background:#0d1117;border:1px solid #1a2030;border-radius:6px;padding:14px;margin-bottom:12px}
body.done #result{display:block;border-color:#22c55e}
body.fail #result{display:block;border-color:#ef4444}
#res-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
body.done #res-t{color:#22c55e}
body.fail #res-t{color:#ef4444}
#res-b{font-size:10px;line-height:1.6;color:#3a4255}

#back{display:none;width:100%;padding:12px;background:#0d1117;border-radius:6px;font:600 11px monospace;cursor:pointer;letter-spacing:.1em;text-align:center;text-decoration:none;margin-bottom:10px}
body.done #back{display:block;border:1px solid #22c55e;color:#22c55e}
body.fail #back{display:block;border:1px solid #ef4444;color:#ef4444}

/* log — only visible when body.log */
#state{font:700 9px monospace;letter-spacing:.15em;text-align:center;color:#ff6600;text-transform:uppercase;min-height:12px;margin-bottom:8px}
#out{background:#030508;border:1px solid #1a2030;border-radius:5px;padding:8px 10px;max-height:300px;overflow-y:auto;font:400 9px/1.7 monospace;white-space:pre-wrap;word-break:break-all}
body:not(.log) #state,body:not(.log) #out{display:none}
.ok{color:#22c55e}.bad{color:#ef4444}.warn{color:#f59e0b}
</style>
</head>
<body>

<div id="hdr">
  <b>ZOOF13R</b><span>WEBKIT</span><span id="fw">FW 13.52</span>
  <div id="dot" class="run"></div>
  <span id="lbl">RUNNING</span>
</div>

<div id="wrap">
  <div id="spin"></div>
  <div id="msg">RUNNING EXPLOIT — DO NOT NAVIGATE AWAY</div>

  <div id="result">
    <div id="res-t"></div>
    <div id="res-b"></div>
  </div>
  <a id="back" href="./">← Back to Main Menu</a>

  <div id="state"></div>
  <div id="out"></div>
</div>

<script>
var dot=document.getElementById('dot'),
    lbl=document.getElementById('lbl'),
    msg=document.getElementById('msg'),
    rest=document.getElementById('res-t'),
    resb=document.getElementById('res-b');

new MutationObserver(function(){
  var c=document.body.className;
  if(c==='done'){
    dot.className='ok'; lbl.textContent='JAILBROKEN';
    msg.textContent='JAILBROKEN — NOW LOAD A PAYLOAD';
    rest.textContent='Kernel Patched Successfully';
    resb.textContent='Go back and tap a payload card (ps4debug / GoldHEN) to load it now.';
  } else if(c==='fail'){
    dot.className='bad'; lbl.textContent='FAILED';
    msg.textContent='FAILED — COLD REBOOT AND RETRY';
    rest.textContent='Exploit Failed — Action Required';
    resb.textContent='Hold power until two beeps (forced shutdown). Boot normally and try again.';
  }
}).observe(document.body,{attributes:true,attributeFilter:['class']});
</script>

<!-- Identical to whiteshadow: static module, fires immediately on page load -->
<script type="module" src="./jb.js?v=2"></script>

</body>
</html>
