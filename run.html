<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZOOF13R // BO2 RTM TOOL & HOST</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg-dark: #121212;
        --bg-base: #1A1A1A;
        --card-bg: #1F1F1F;
        --border-color: #333333;
        --text-main: #E0E0E0;
        --text-dim: #A0A0A0;
        --green: #00FF00;
        --red: #FF3333;
      }

      /* ── Pure Off-Thread CSS RGB Animations (Zero JS Memory Footprint) ── */
      @keyframes rgbGlowText {
        0%   { color: #FF0000; text-shadow: 0 0 12px rgba(255, 0, 0, 0.6); }
        17%  { color: #FFFF00; text-shadow: 0 0 12px rgba(255, 255, 0, 0.6); }
        33%  { color: #00FF00; text-shadow: 0 0 12px rgba(0, 255, 0, 0.6); }
        50%  { color: #00FFFF; text-shadow: 0 0 12px rgba(0, 255, 255, 0.6); }
        67%  { color: #0000FF; text-shadow: 0 0 12px rgba(0, 0, 255, 0.6); }
        83%  { color: #FF00FF; text-shadow: 0 0 12px rgba(255, 0, 255, 0.6); }
        100% { color: #FF0000; text-shadow: 0 0 12px rgba(255, 0, 0, 0.6); }
      }

      @keyframes rgbGlowBorder {
        0%   { border-color: #FF0000 !important; box-shadow: 0 0 15px rgba(255, 0, 0, 0.6) !important; }
        17%  { border-color: #FFFF00 !important; box-shadow: 0 0 15px rgba(255, 255, 0, 0.6) !important; }
        33%  { border-color: #00FF00 !important; box-shadow: 0 0 15px rgba(0, 255, 0, 0.6) !important; }
        50%  { border-color: #00FFFF !important; box-shadow: 0 0 15px rgba(0, 255, 255, 0.6) !important; }
        67%  { border-color: #0000FF !important; box-shadow: 0 0 15px rgba(0, 0, 255, 0.6) !important; }
        83%  { border-color: #FF00FF !important; box-shadow: 0 0 15px rgba(255, 0, 255, 0.6) !important; }
        100% { border-color: #FF0000 !important; box-shadow: 0 0 15px rgba(255, 0, 0, 0.6) !important; }
      }

      @keyframes rgbSpinnerTop {
        0%   { border-top-color: #FF0000 !important; box-shadow: 0 0 20px rgba(255, 0, 0, 0.6); }
        17%  { border-top-color: #FFFF00 !important; box-shadow: 0 0 20px rgba(255, 255, 0, 0.6); }
        33%  { border-top-color: #00FF00 !important; box-shadow: 0 0 20px rgba(0, 255, 0, 0.6); }
        50%  { border-top-color: #00FFFF !important; box-shadow: 0 0 20px rgba(0, 255, 255, 0.6); }
        67%  { border-top-color: #0000FF !important; box-shadow: 0 0 20px rgba(0, 0, 255, 0.6); }
        83%  { border-top-color: #FF00FF !important; box-shadow: 0 0 20px rgba(255, 0, 255, 0.6); }
        100% { border-top-color: #FF0000 !important; box-shadow: 0 0 20px rgba(255, 0, 0, 0.6); }
      }

      .rgb-text {
        animation: rgbGlowText 6s linear infinite;
      }

      .star {
        font-size: 10px;
        vertical-align: middle;
        display: inline-block;
        margin: 0 8px;
        transform: translateY(-2px);
        animation: rgbGlowText 6s linear infinite;
      }

      html, body {
        min-height: 100vh;
        background: var(--bg-dark);
        color: var(--text-main);
        font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
      }

      #app-base {
        width: 100%;
        min-height: 100vh;
        border: 1px solid #FF0000;
        animation: rgbGlowBorder 6s linear infinite;
        background-color: var(--bg-base);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* Top Bar */
      #top-bar {
        background-color: #111111;
        border-bottom: 2px solid #FF0000;
        animation: rgbGlowBorder 6s linear infinite;
        height: 85px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 25px;
      }
      .brand-left {
        font-family: 'Arial Black', Impact, sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 36px;
        letter-spacing: 2px;
        animation: rgbGlowText 6s linear infinite;
      }
      .brand-center {
        font-family: 'Arial Black', Impact, sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 42px;
        letter-spacing: 4px;
        display: flex;
        align-items: center;
        animation: rgbGlowText 6s linear infinite;
      }
      .status-badge {
        font-weight: 800;
        font-size: 13px;
        display: flex;
        align-items: center;
        animation: rgbGlowText 6s linear infinite;
      }

      #main-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
      }

      /* Spinner */
      #spin {
        width: 60px;
        height: 60px;
        border: 4px solid var(--border-color);
        border-radius: 50%;
        animation: spin 0.75s linear infinite, rgbSpinnerTop 6s linear infinite;
        margin-bottom: 25px;
      }
      body.done #spin {
        border-color: var(--green) !important;
        border-top-color: var(--green) !important;
        animation: none !important;
        box-shadow: 0 0 25px rgba(0, 255, 0, 0.4) !important;
      }
      body.fail #spin {
        border-color: var(--red) !important;
        border-top-color: var(--red) !important;
        animation: none !important;
        box-shadow: 0 0 25px rgba(255, 51, 51, 0.4) !important;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      #msg {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: rgbGlowText 6s linear infinite;
      }
      body.done #msg { color: var(--green) !important; text-shadow: 0 0 12px rgba(0,255,0,0.6) !important; animation: none !important; }
      body.fail #msg { color: var(--red) !important; text-shadow: 0 0 12px rgba(255,51,51,0.6) !important; animation: none !important; }

      /* Bottom Green Log Console */
      #log-frame {
        width: 100%;
        padding: 15px 25px 25px 25px;
      }
      #log-box {
        background-color: #0A0A0A;
        color: var(--green);
        font-family: Consolas, 'Courier New', monospace;
        font-size: 13px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 12px;
        height: 100px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
        text-align: left;
      }

      #wrap { display: none; }
      body.log #wrap { display: block; }
    </style>
  </head>
  <body>
    <div id="app-base">
      <div id="top-bar">
        <div class="brand-left">ZOOF13R'S</div>
        <div class="brand-center"><span class="star">★</span> WEBKIT <span class="star">★</span></div>
        <div class="status-badge">EXPLOIT ENGINE</div>
      </div>

      <div id="main-wrap">
        <div id="spin"></div>
        <div id="msg"><span class="star">★</span> RUNNING EXPLOIT ENGINE — DO NOT NAVIGATE AWAY <span class="star">★</span></div>
        <div id="wrap">
          <div id="state"></div>
          <div id="out"></div>
        </div>
      </div>

      <div id="log-frame">
        <div id="log-box">[EXPLOIT ENGINE] EXECUTING WEBKIT PRIMITIVE AND KERNEL PATCH CHAIN...</div>
      </div>
    </div>

    <!-- DOM State Observer Script -->
    <script>
    var msgEl = document.getElementById('msg');
    var logBox = document.getElementById('log-box');
    new MutationObserver(function() {
      var c = document.body.className;
      var ts = new Date().toTimeString().split(' ')[0];
      if (c.indexOf('done') !== -1) {
        msgEl.innerHTML = '<span class="star">★</span> JAILBROKEN — NOW SELECT PAYLOAD <span class="star">★</span>';
        logBox.innerHTML += '\n[' + ts + '] ✓ EXPLOIT & KERNEL PATCH SUCCESSFUL!';
      } else if (c.indexOf('fail') !== -1) {
        msgEl.innerHTML = '<span class="star">★</span> FAILED — COLD REBOOT PS4 AND RETRY <span class="star">★</span>';
        logBox.innerHTML += '\n[' + ts + '] ✗ EXPLOIT FAILED — COLD REBOOT REQUIRED.';
      }
    }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
    </script>

    <!-- Clean Whiteshadow Parity Exploit Import -->
    <script type="module">
      import "./jb.js";
    </script>
  </body>
</html>
