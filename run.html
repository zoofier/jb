<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZOOF13R // RUNNING 13.52</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080a0d;--panel:#0d1117;--border:#1a2030;
  --orange:#ff6600;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;
  --text:#9aa3b0;--text-hi:#dde4f0;--text-dim:#3a4255;
  --mono:'JetBrains Mono',Consolas,monospace;
  --sans:'Inter',system-ui,sans-serif;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.025) 3px,rgba(0,0,0,.025) 4px);pointer-events:none;z-index:0}

#hdr{position:sticky;top:0;z-index:200;display:flex;align-items:center;padding:0 18px;height:50px;background:rgba(8,10,13,.96);border-bottom:2px solid var(--orange)}
.brand-z{color:var(--orange);font:900 17px/1 var(--sans);letter-spacing:.1em;font-style:italic}
.brand-sep{width:2px;height:18px;background:var(--orange);margin:0 10px;opacity:.5;display:inline-block;vertical-align:middle}
.brand-w{color:var(--text-hi);font:700 13px/1 var(--sans);letter-spacing:.28em}
.brand-fw{margin-left:10px;padding:2px 8px;border:1px solid var(--orange);border-radius:3px;color:var(--orange);font:700 9px/1 var(--mono);letter-spacing:.15em;display:inline-block;vertical-align:middle}
.hdr-status{margin-left:auto;display:flex;align-items:center;gap:6px}
.hd{width:6px;height:6px;border-radius:50%;background:var(--text-dim)}
.hd.run{background:var(--orange);box-shadow:0 0 7px var(--orange);animation:glow .7s infinite}
.hd.ok{background:var(--green);box-shadow:0 0 7px var(--green)}
.hd.bad{background:var(--red);box-shadow:0 0 7px var(--red)}
#hdr-label{font:600 9px/1 var(--mono);letter-spacing:.15em;color:var(--text-dim)}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.3}}

/* ── body states ── */
body { --msg: 'RUNNING EXPLOIT — DO NOT NAVIGATE AWAY'; --msg-color: #ff6600; }
body.done { --msg: '✓ JAILBROKEN — RESTART YOUR PS4'; --msg-color: #22c55e; }
body.fail { --msg: '✗ FAILED — COLD REBOOT AND RETRY'; --msg-color: #ef4444; }

#wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:30px 14px}

/* spinner */
#spin{width:52px;height:52px;border:3px solid #1a2030;border-top-color:var(--orange);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto 24px}
body.done #spin, body.fail #spin{animation:none;border-color:transparent}
body.done #spin{border-top-color:var(--green)}
body.fail #spin{border-top-color:var(--red)}
@keyframes sp{to{transform:rotate(360deg)}}

/* big status */
#msg{text-align:center;font:900 18px/1.3 var(--sans);letter-spacing:.08em;color:var(--orange);margin-bottom:28px;text-transform:uppercase;word-break:break-word;transition:color .3s}
body.done #msg{color:var(--green)}
body.fail #msg{color:var(--red)}

/* result panel */
#result{display:none;background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
body.done #result, body.fail #result{display:block}
body.done #result{border-color:var(--green);background:rgba(34,197,94,.07)}
body.fail #result{border-color:var(--red);background:rgba(239,68,68,.07)}
.res-title{font:700 12px/1 var(--sans);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
body.done .res-title{color:var(--green)}
body.fail .res-title{color:var(--red)}
.res-body{font:400 10px/1.6 var(--mono);color:var(--text-dim)}

/* back button */
#back{display:none;width:100%;padding:13px;background:#0d1117;border:1px solid var(--border);border-radius:7px;color:var(--text);font:600 11px/1 var(--mono);cursor:pointer;letter-spacing:.1em;text-align:center;text-decoration:none;margin-bottom:10px}
body.done #back, body.fail #back{display:block}
body.fail #back{border-color:var(--red);color:var(--red)}
body.done #back{border-color:var(--green);color:var(--green)}

/* log */
#state{font:700 10px/1 var(--mono);letter-spacing:.15em;text-align:center;margin-bottom:12px;color:var(--orange);text-transform:uppercase;min-height:14px}
#out{background:#030508;border:1px solid var(--border);border-radius:7px;padding:10px 12px;max-height:320px;overflow-y:auto;font:400 10px/1.7 var(--mono);white-space:pre-wrap;word-break:break-all;scrollbar-width:thin;scrollbar-color:#253040 transparent}
#out::-webkit-scrollbar{width:3px}
#out::-webkit-scrollbar-thumb{background:#253040;border-radius:3px}
.ok{color:#22c55e}.bad{color:#ef4444}.warn{color:#f59e0b}.info{color:#3b82f6}

/* only show log when log=1 */
body:not(.log) #out, body:not(.log) #state{display:none}
</style>
</head>
<body>

<div id="hdr">
  <span class="brand-z">ZOOF13R</span>
  <span class="brand-sep"></span>
  <span class="brand-w">WEBKIT</span>
  <span class="brand-fw">FW 13.52</span>
  <div class="hdr-status">
    <div class="hd run" id="hd"></div>
    <span id="hdr-label">RUNNING</span>
  </div>
</div>

<div id="wrap">
  <div id="spin"></div>
  <div id="msg">RUNNING EXPLOIT — DO NOT NAVIGATE AWAY</div>

  <div id="result">
    <div class="res-title" id="res-title"></div>
    <div class="res-body" id="res-body"></div>
  </div>

  <a id="back" href="./"></a>

  <div id="state"></div>
  <div id="out"></div>
</div>

<script>
// Watch for jb.js changing body class → update UI
var hd = document.getElementById('hd');
var hdrLabel = document.getElementById('hdr-label');
var resTitle = document.getElementById('res-title');
var resBody  = document.getElementById('res-body');
var backEl   = document.getElementById('back');
var msgEl    = document.getElementById('msg');

new MutationObserver(function() {
  var c = document.body.className;
  if (c === 'done') {
    hd.className = 'hd ok';
    hdrLabel.textContent = 'JAILBROKEN';
    msgEl.textContent = '✓ JAILBROKEN — NOW LOAD A PAYLOAD';
    resTitle.textContent = 'Jailbreak Successful';
    resBody.textContent  = 'Kernel patched. Go back to the main menu and tap a payload card (ps4debug or GoldHEN) to load it now. No reboot needed yet.';
    backEl.textContent = '← Back to Main Menu';
    backEl.href = './';
  } else if (c === 'fail') {
    hd.className = 'hd bad';
    hdrLabel.textContent = 'FAILED';
    msgEl.textContent = '✗ FAILED — COLD REBOOT AND RETRY';
    resTitle.textContent = 'Exploit Failed — Action Required';
    resBody.textContent  = 'Hold power until two beeps (forced shutdown). Boot normally, then navigate back to the main menu and try again.';
    backEl.textContent = '↩ Retry — Back to Main Menu';
    backEl.href = './';
  }
}).observe(document.body, {attributes: true, attributeFilter: ['class']});
</script>

<!-- Identical to whiteshadow: static module import fires immediately on page load -->
<script type="module" src="./jb.js?v=2"></script>

</body>
</html>
