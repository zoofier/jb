<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZOOF13R // BO2 RTM TOOL & HOST</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;900&family=Consolas:wght@400;700&display=swap");
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg-dark: #121212;
        --bg-base: #1A1A1A;
        --card-bg: #1F1F1F;
        --border-color: #333333;
        --text-main: #E0E0E0;
        --text-dim: #A0A0A0;
        --green: #00FF00;
        --red: #FF3333;
        --rgb-color: #FF6600;
        --rgb-shadow: rgba(255, 102, 0, 0.6);
      }

      /* ── Global Master RGB Styles ── */
      .rgb-text {
        color: var(--rgb-color) !important;
        text-shadow: 0 0 12px var(--rgb-shadow) !important;
      }

      .rgb-border {
        border-color: var(--rgb-color) !important;
        box-shadow: 0 0 12px var(--rgb-shadow) !important;
      }

      .star {
        font-size: 10px;
        vertical-align: middle;
        display: inline-block;
        margin: 0 6px;
        transform: translateY(-2px);
        color: var(--rgb-color) !important;
        text-shadow: 0 0 8px var(--rgb-shadow) !important;
      }

      html, body {
        min-height: 100vh;
        background: var(--bg-dark);
        color: var(--text-main);
        font-family: 'Segoe UI', Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
      }
      #app-base {
        width: 100%;
        min-height: 100vh;
        border: 1px solid var(--rgb-color) !important;
        box-shadow: 0 0 15px var(--rgb-shadow);
        background-color: var(--bg-base);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      /* Top Bar */
      #top-bar {
        background-color: #111111;
        border-bottom: 2px solid var(--rgb-color) !important;
        height: 85px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 25px;
      }
      .brand-left {
        font-family: 'Arial Black', Impact, sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 36px;
        letter-spacing: 2px;
        color: var(--rgb-color) !important;
        text-shadow: 0 0 15px var(--rgb-shadow) !important;
      }
      .brand-center {
        font-family: 'Arial Black', Impact, sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 42px;
        letter-spacing: 4px;
        color: var(--rgb-color) !important;
        text-shadow: 0 0 20px var(--rgb-shadow) !important;
      }
      .status-badge {
        font-weight: 800;
        font-size: 14px;
        display: flex;
        align-items: center;
        color: var(--rgb-color) !important;
        text-shadow: 0 0 10px var(--rgb-shadow) !important;
      }

      #main-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
      }

      /* Spinner */
      #spin {
        width: 60px;
        height: 60px;
        border: 4px solid var(--border-color);
        border-top-color: var(--rgb-color) !important;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        margin-bottom: 25px;
        box-shadow: 0 0 20px var(--rgb-shadow);
      }
      body.done #spin {
        border-color: var(--green) !important;
        border-top-color: var(--green) !important;
        animation: none;
        box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
      }
      body.fail #spin {
        border-color: var(--red) !important;
        border-top-color: var(--red) !important;
        animation: none;
        box-shadow: 0 0 25px rgba(255, 51, 51, 0.4);
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      #msg {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--rgb-color) !important;
        text-shadow: 0 0 12px var(--rgb-shadow) !important;
      }
      body.done #msg { color: var(--green) !important; text-shadow: 0 0 12px rgba(0,255,0,0.6) !important; }
      body.fail #msg { color: var(--red) !important; text-shadow: 0 0 12px rgba(255,51,51,0.6) !important; }

      /* Bottom Green Log Console */
      #log-frame {
        width: 100%;
        padding: 15px 25px 25px 25px;
      }
      #log-box {
        background-color: #0A0A0A;
        color: var(--green);
        font-family: Consolas, 'Courier New', monospace;
        font-size: 13px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 12px;
        height: 100px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
        text-align: left;
      }

      #wrap { display: none; }
      body.log #wrap { display: block; }
    </style>
  </head>
  <body>
    <div id="app-base">
      <div id="top-bar">
        <div class="brand-left"><span class="star">★</span> ZOOF13R'S <span class="star">★</span></div>
        <div class="brand-center"><span class="star">★</span> WEBKIT <span class="star">★</span></div>
        <div class="status-badge"><span class="star">★</span> EXPLOIT ENGINE <span class="star">★</span></div>
      </div>

      <div id="main-wrap">
        <div id="spin"></div>
        <div id="msg"><span class="star">★</span> RUNNING EXPLOIT ENGINE — DO NOT NAVIGATE AWAY <span class="star">★</span></div>
        <div id="wrap">
          <div id="state"></div>
          <div id="out"></div>
        </div>
      </div>

      <div id="log-frame">
        <div id="log-box">[EXPLOIT ENGINE] EXECUTING WEBKIT PRIMITIVE AND KERNEL PATCH CHAIN...</div>
      </div>
    </div>

    <!-- Master RGB Engine Script -->
    <script>
    (function startRGBEngine() {
      var hue = 0;
      setInterval(function() {
        hue = (hue + 2) % 360;
        var h = hue / 60;
        var x = 1 - Math.abs((h % 2) - 1);
        var r = 0, g = 0, b = 0;
        if (h < 1) { r = 1; g = x; b = 0; }
        else if (h < 2) { r = x; g = 1; b = 0; }
        else if (h < 3) { r = 0; g = 1; b = x; }
        else if (h < 4) { r = 0; g = x; b = 1; }
        else if (h < 5) { r = x; g = 0; b = 1; }
        else { r = 1; g = 0; b = x; }
        
        var hexR = Math.round(r * 255).toString(16).padStart(2, '0');
        var hexG = Math.round(g * 255).toString(16).padStart(2, '0');
        var hexB = Math.round(b * 255).toString(16).padStart(2, '0');
        var color = '#' + hexR + hexG + hexB;
        var shadow = 'rgba(' + Math.round(r*255) + ',' + Math.round(g*255) + ',' + Math.round(b*255) + ', 0.6)';

        document.documentElement.style.setProperty('--rgb-color', color);
        document.documentElement.style.setProperty('--rgb-shadow', shadow);
      }, 50);
    })();

    var msgEl = document.getElementById('msg');
    var logBox = document.getElementById('log-box');
    new MutationObserver(function() {
      var c = document.body.className;
      var ts = new Date().toTimeString().split(' ')[0];
      if (c.indexOf('done') !== -1) {
        msgEl.innerHTML = '<span class="star">★</span> JAILBROKEN — NOW SELECT PAYLOAD <span class="star">★</span>';
        logBox.innerHTML += '\n[' + ts + '] ✓ EXPLOIT & KERNEL PATCH SUCCESSFUL!';
      } else if (c.indexOf('fail') !== -1) {
        msgEl.innerHTML = '<span class="star">★</span> FAILED — COLD REBOOT PS4 AND RETRY <span class="star">★</span>';
        logBox.innerHTML += '\n[' + ts + '] ✗ EXPLOIT FAILED — COLD REBOOT REQUIRED.';
      }
    }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
    </script>

    <script type="module">
      import "./jb.js?v=11";
    </script>
  </body>
</html>
